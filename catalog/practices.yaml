- id: SCRIPT-01
  area: SCRIPT
  title: Scripts solve problems
  strength: directive
  strength_word: handle error conditions
  strength_source: BP
  profiles:
    - claude-code
    - portable
  assess:
    - judgement
    - live
  assessable_from: artifact
  freshness: undated-live
  contested: false
  experimental: true
  experimental_reason: applicability split in round 3 (figma-generate-library n/a vs 1)
  experimental_source: agreement-real-b.md (SKM-24 real-skill test, round 3)
  scope_note: Not applicable when the skill bundles no script. Scores whether every file, parse, network and subprocess call is guarded or fails loudly; the wording of the message is SCRIPT-05, and dependencies are SCRIPT-04. A top-level handler that catches every exception and exits non-zero with a message guards every call under it. Parse means converting external input, such as JSON, YAML or numbers; calls through the Node fs module count as file calls. Judge every bundled script file, including those in examples/; code inside markdown is not a script. A bare except with pass, an empty handler and an or-true tail after a command ignore the error, so they stop a script from reaching level 3. Judge per call, by listing each call and marking it guarded, loud or neither.
  quotes:
    - text: When writing scripts for Skills, handle error conditions rather than deferring to Claude.
      source: BP
      section: Solve, don't defer
  anchors:
    "0": No file, parse, network or subprocess call in any bundled script is guarded or fails loudly, so failures end as raw tracebacks.
    "1": At least one such call is guarded or fails loudly, and at least one such call in some script is neither.
    "2": Every such call is guarded or fails loudly, but at least one handler ignores the error with no fallback value or re-raises it unchanged.
    "3": Every such call is guarded or fails loudly, and each handler either recovers with a fallback or exits non-zero with a message.
  fix_hint: Wrap each file, parse and network call in the scripts in a handler that recovers with a default or exits non-zero with a message.
  inferred: true
