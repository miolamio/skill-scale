- id: SCRIPT-06
  area: SCRIPT
  title: Plan, validate, execute for batch or destructive work
  strength: statement
  strength_word: When to use
  strength_source: BP
  profiles:
    - claude-code
    - portable
  assess:
    - judgement
  assessable_from: artifact
  freshness: undated-live
  contested: false
